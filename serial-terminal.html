<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Serial Terminal</title>
<style>
  :root {
    --bg: #f3f3f3; --panel: #ffffff; --border: #c8c8c8; --text: #1b1b1b; --muted: #666;
    --accent: #0067c0; --accent-text: #fff; --term-bg: #0f1419; --term-text: #d6deeb;
    --ok: #1a7f37; --err: #c62828;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1e1e1e; --panel: #2a2a2a; --border: #444; --text: #e6e6e6; --muted: #9a9a9a;
            --accent: #4ca0ff; --accent-text: #000; --term-bg: #0b0e12; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text);
         font: 14px/1.4 "Segoe UI", system-ui, sans-serif; }
  .banner { padding: 10px 12px; border-radius: 6px; background: var(--err); color: #fff; margin-bottom: 12px; display: none; }
  .bar { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
  button { padding: 7px 16px; font: inherit; border: 1px solid var(--border); border-radius: 4px;
           background: var(--panel); color: var(--text); cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; min-width: 110px; }
  button:disabled { opacity: .45; cursor: default; }
  .status { color: var(--muted); }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
  .dot.on { background: var(--ok); }
  .spacer { flex: 1; }
  #output { height: calc(100vh - 140px); min-height: 200px; overflow-y: auto; margin: 0; padding: 10px;
            background: var(--term-bg); color: var(--term-text); border-radius: 6px;
            font: 13px/1.35 Consolas, "Cascadia Mono", monospace; white-space: pre-wrap; word-break: break-all; }
  #output .sys { color: #4fa3ff; } #output .err { color: #ff6b6b; } #output .tx { color: #c3e88d; }
  .send { display: flex; gap: 8px; margin-top: 10px; }
  .send input { flex: 1; min-width: 0; padding: 6px 8px; font: 13px Consolas, monospace; color: var(--text);
                background: var(--panel); border: 1px solid var(--border); border-radius: 4px; }
</style>
</head>
<body>
<div class="banner" id="noSerial">Web Serial is not available in this browser. Use Chrome or Edge on a desktop computer.</div>

<div class="bar">
  <button id="btnConnect" class="primary">Connect</button>
  <span class="status"><span class="dot" id="dot"></span><span id="statusText">Disconnected</span></span>
  <span class="spacer"></span>
  <button id="btnClear">Clear</button>
</div>

<pre id="output"></pre>

<div class="send">
  <input id="txText" type="text" placeholder="Type a command and press Enter" disabled>
  <button id="btnSend" disabled>Send</button>
</div>

<script>
// Fixed controller settings: 115200 baud, 8 data bits, no parity, 1 stop bit, no flow control.
const SERIAL_OPTIONS = { baudRate: 115200, dataBits: 8, parity: 'none', stopBits: 1, flowControl: 'none' };
const LINE_ENDING = '\r\n';   // appended to every command sent

const $ = id => document.getElementById(id);
const out = $('output');
const encoder = new TextEncoder();
let decoder = new TextDecoder();
let port = null, reader = null, writer = null, readLoopPromise = null, keepReading = false;
let atLineStart = true;

function append(text, cls) {
  if (!text) return;
  const node = cls ? Object.assign(document.createElement('span'), { className: cls, textContent: text })
                   : document.createTextNode(text);
  out.appendChild(node);
  atLineStart = text.endsWith('\n');
  while (out.textContent.length > 500000 && out.firstChild) out.removeChild(out.firstChild);
  out.scrollTop = out.scrollHeight;
}
function sys(msg, cls = 'sys') { append(`${atLineStart ? '' : '\n'}*** ${msg}\n`, cls); }

function updateUI() {
  const open = !!port;
  $('btnConnect').textContent = open ? 'Disconnect' : 'Connect';
  $('dot').classList.toggle('on', open);
  $('statusText').textContent = open ? 'Connected' : 'Disconnected';
  $('txText').disabled = $('btnSend').disabled = !open;
}

async function connect() {
  let p;
  try {
    p = await navigator.serial.requestPort();   // browser's port-picker dialog
  } catch (e) {
    if (e.name !== 'NotFoundError') sys('Port selection failed: ' + e.message, 'err');  // NotFoundError = cancelled
    return;
  }
  try {
    await p.open(SERIAL_OPTIONS);
  } catch (e) {
    sys(`Could not open port: ${e.message} (is another program using it?)`, 'err');
    return;
  }
  port = p;
  decoder = new TextDecoder();
  writer = port.writable.getWriter();
  keepReading = true;
  readLoopPromise = readLoop();
  sys('Connected.');
  updateUI();
  $('txText').focus();
}

async function readLoop() {
  // Outer loop recovers from non-fatal errors (framing, overrun): the browser supplies a new readable stream.
  while (port && port.readable && keepReading) {
    reader = port.readable.getReader();
    try {
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        if (value) append(decoder.decode(value, { stream: true }));
      }
    } catch (e) {
      if (keepReading) sys('Read error: ' + e.message, 'err');
    } finally {
      reader.releaseLock();
      reader = null;
    }
  }
}

async function disconnect(unplugged = false) {
  if (!port) return;
  keepReading = false;
  if (reader) { try { await reader.cancel(); } catch {} }
  if (readLoopPromise) { try { await readLoopPromise; } catch {} }
  if (writer) { try { writer.releaseLock(); } catch {} writer = null; }
  try { await port.close(); } catch {}
  port = null;
  sys(unplugged ? 'Controller unplugged — disconnected.' : 'Disconnected.');
  updateUI();
}

async function send() {
  const text = $('txText').value;
  if (!writer || !text) return;
  try {
    await writer.write(encoder.encode(text + LINE_ENDING));
    append(`${atLineStart ? '' : '\n'}> ${text}\n`, 'tx');
    $('txText').value = '';
  } catch (e) { sys('Write failed: ' + e.message, 'err'); }
}

$('btnConnect').onclick = () => port ? disconnect() : connect();
$('btnSend').onclick = send;
$('txText').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
$('btnClear').onclick = () => { out.textContent = ''; atLineStart = true; };

if (!('serial' in navigator)) {
  $('noSerial').style.display = 'block';
  $('btnConnect').disabled = true;
} else {
  navigator.serial.addEventListener('disconnect', e => { if (e.target === port) disconnect(true); });
  window.addEventListener('beforeunload', () => { if (port) disconnect(); });
}
updateUI();
</script>
</body>
</html>
